<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="4D abstract data compliance visualization">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#030303"/>
      <stop offset="55%" stop-color="#0a0a12"/>
      <stop offset="100%" stop-color="#030303"/>
    </linearGradient>
    <radialGradient id="glow1" cx="30%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#ff514a" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ff514a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="70%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#ff514a" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ff514a"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <filter id="blurSm" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)"/>
  <rect width="1200" height="800" fill="url(#glow1)"/>
  <rect width="1200" height="800" fill="url(#glow2)"/>

  <!-- depth grid (4D floor plane) -->
  <g opacity="0.22" stroke="#3a3a4a" stroke-width="1">
    <line x1="0" y1="620" x2="1200" y2="620"/>
    <line x1="0" y1="560" x2="1200" y2="560"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="0" y1="440" x2="1200" y2="440"/>
    <line x1="0" y1="380" x2="1200" y2="380"/>
    <line x1="120" y1="380" x2="180" y2="620"/>
    <line x1="320" y1="380" x2="380" y2="620"/>
    <line x1="520" y1="380" x2="580" y2="620"/>
    <line x1="720" y1="380" x2="780" y2="620"/>
    <line x1="920" y1="380" x2="980" y2="620"/>
    <line x1="1120" y1="380" x2="1180" y2="620"/>
  </g>

  <!-- floating depth cubes (4D parallax layers) -->
  <g filter="url(#blurSm)" opacity="0.9">
    <g transform="translate(140,180)">
      <rect x="0" y="0" width="90" height="90" rx="10" fill="none" stroke="#ff514a" stroke-opacity="0.8" stroke-width="2"/>
      <rect x="14" y="14" width="62" height="62" rx="8" fill="none" stroke="#ff514a" stroke-opacity="0.35" stroke-width="1.5"/>
      <rect x="28" y="28" width="34" height="34" rx="6" fill="url(#bar)" opacity="0.5"/>
    </g>
    <g transform="translate(950,120)">
      <rect x="0" y="0" width="70" height="70" rx="10" fill="none" stroke="#22d3ee" stroke-opacity="0.8" stroke-width="2"/>
      <rect x="12" y="12" width="46" height="46" rx="8" fill="none" stroke="#22d3ee" stroke-opacity="0.35" stroke-width="1.5"/>
      <circle cx="35" cy="35" r="10" fill="#22d3ee" opacity="0.4"/>
    </g>
  </g>

  <!-- rising compliance bars (data audit visual) -->
  <g>
    <rect x="380" y="330" width="34" height="290" rx="6" fill="url(#bar)" filter="url(#blurSm)" opacity="0.7"/>
    <rect x="430" y="260" width="34" height="360" rx="6" fill="url(#bar)"/>
    <rect x="480" y="380" width="34" height="240" rx="6" fill="url(#bar2)" opacity="0.75"/>
    <rect x="530" y="210" width="34" height="410" rx="6" fill="url(#bar2)"/>
    <rect x="580" y="300" width="34" height="320" rx="6" fill="url(#bar)" opacity="0.8"/>
    <rect x="630" y="240" width="34" height="380" rx="6" fill="url(#bar)"/>
    <rect x="680" y="350" width="34" height="270" rx="6" fill="url(#bar2)" opacity="0.7"/>
  </g>

  <!-- glowing center core (shield/audit seal) -->
  <g filter="url(#blur)">
    <circle cx="600" cy="400" r="150" fill="#ff514a" opacity="0.12"/>
    <circle cx="600" cy="400" r="95" fill="#22d3ee" opacity="0.10"/>
  </g>
  <g>
    <circle cx="600" cy="400" r="64" fill="none" stroke="#ff514a" stroke-width="2.5" opacity="0.9"/>
    <circle cx="600" cy="400" r="48" fill="none" stroke="#22d3ee" stroke-width="1.5" opacity="0.7"/>
    <circle cx="600" cy="400" r="18" fill="#ff514a" opacity="0.85"/>
  </g>

  <!-- orbiting particles (4D depth dots) -->
  <g fill="#f5f5f0">
    <circle cx="310" cy="250" r="3" opacity="0.8"/>
    <circle cx="760" cy="180" r="2.5" opacity="0.6"/>
    <circle cx="880" cy="300" r="3" opacity="0.7"/>
    <circle cx="240" cy="420" r="2" opacity="0.5"/>
    <circle cx="980" cy="480" r="2.5" opacity="0.6"/>
    <circle cx="420" cy="140" r="2" opacity="0.5"/>
    <circle cx="690" cy="520" r="2.5" opacity="0.5"/>
  </g>

  <!-- bottom fade -->
  <rect x="0" y="680" width="1200" height="120" fill="#030303" opacity="0.85"/>
</svg>
